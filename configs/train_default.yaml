# Default training configuration for the XAI-IDS benchmark.
# Reproduces the primary results reported in Tables 3 (multi-class) and 4 (binary).

experiment:
  name: default
  output_dir: results_2026_03_03
  primary_seed: 42
  variance_seeds: [17, 42, 123, 2024, 31337]
  log_every: 100   # steps between progress prints
  save_checkpoints: true

data:
  dataset_root: "CIC IoT-DIAD 2024/"
  train_fraction: 0.70
  val_fraction: 0.15
  test_fraction: 0.15
  stratified_split: true
  chunk_size: 50000    # rows per CSV chunk (memory-bound)
  dtype: float32
  deduplicate: true    # removes 2.5M (~13%) duplicate rows

preprocessing:
  imputation: median
  normalization: standard   # StandardScaler
  balancing:
    strategy: hybrid        # undersample large + SMOTE small
    undersample_threshold: 100000
    smote_threshold: 50000
    smote_k_neighbors: 5
    smote_random_state: 42

training:
  optimizer: adam
  lr_search:
    enabled: true
    n_trials: 30
    space: [0.0001, 0.001, 0.005, 0.01]
  scheduler:
    name: ReduceLROnPlateau
    factor: 0.5
    patience: 5
    mode: min
    min_lr: 1.0e-6
  early_stopping:
    monitor: val_loss
    patience: 10
    restore_best_weights: true
  loss: class_weighted_cross_entropy
  class_weighting: inverse_frequency
  mixed_precision: true   # torch.cuda.amp.GradScaler
  max_epochs: 100
  batch_sizes:
    recurrent: 256        # GRU, BiLSTM-Att.
    convolutional: 512    # ResNet1D, TCN, CNN-LSTM
    attention: 512        # Transformer, FT-Transformer
    other: 512            # TabNet, AE-Classifier

evaluation:
  metrics:
    - accuracy
    - balanced_accuracy
    - f1_macro
    - f1_weighted
    - mcc
    - roc_auc
    - g_mean
    - far
  bootstrap_n: 30
  confidence_level: 0.95

xai:
  shap:
    explainer: KernelExplainer
    n_samples: 30
    background_size: 100
  lime:
    n_samples: 30
    num_features: 10
    num_samples_per_explanation: 500
  stability:
    perturbation_radius: 0.05
    n_perturbations: 20
    top_k: 10

adversarial:
  fgsm:
    epsilons: [0.1, 0.3, 0.5]
  pgd:
    epsilon: 0.3
    iters: 10
    alpha_factor: 4    # step size = epsilon / alpha_factor
  noise:
    sigmas: [0.05, 0.10, 0.15]
  feature_perturbation:
    top_k_values: [1, 5, 10, 20]

statistical:
  alpha: 0.05
  correction: holm
  bootstrap_n: 30

hardware:
  device: cuda
  num_workers: 4
  pin_memory: true

logging:
  level: INFO
  log_to_file: true
  log_to_tensorboard: true
